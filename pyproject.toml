[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "scorebridge"
version = "0.1.0"
description = "Agent controlled music notation bridge for OMR, MusicXML and notation software"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.0,<2"]
image = ["Pillow>=10", "PyMuPDF>=1.24"]
audio = ["numpy>=1.24", "matplotlib>=3.7"]
websocket = ["websockets>=12"]
test = ["pytest>=8"]

[project.scripts]
scorebridge = "scorebridge.cli:main"

[tool.setuptools.package-data]
"scorebridge.musescore" = ["commands.js"]
